name: aiworkspace-backup-verify

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aiworkspace_restore
      POSTGRES_PASSWORD: aiworkspace_restore
      POSTGRES_DB: aiworkspace_restore
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aiworkspace_restore -d aiworkspace_restore",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restore_postgres_data: