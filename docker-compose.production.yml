services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-aiworkspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
      POSTGRES_DB: ${DB_NAME:-aiworkspace_prod}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiworkspace}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aiworkspace


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-supersecret}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-supersecret}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aiworkspace


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    ports:
      - "${API_PORT:-4000}:4000"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aiworkspace}:${DB_PASSWORD:-supersecret}@postgres:5432/${DB_NAME:-aiworkspace_prod}
      DIRECT_DATABASE_URL: postgresql://${DB_USER:-aiworkspace}:${DB_PASSWORD:-supersecret}@postgres:5432/${DB_NAME:-aiworkspace_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-supersecret}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-aiworkspace-api}
      JWT_ACCESS_AUDIENCE: ${JWT_ACCESS_AUDIENCE:-aiworkspace-api}
      JWT_REFRESH_AUDIENCE: ${JWT_REFRESH_AUDIENCE:-aiworkspace-auth}
      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - aiworkspace


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    ports:
      - "${WEB_PORT:-80}:80"

    depends_on:
      - api

    networks:
      - aiworkspace


volumes:
  postgres_data:
  redis_data:

networks:
  aiworkspace:
    driver: bridge
