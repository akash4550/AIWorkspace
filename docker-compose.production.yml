version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-aiworkspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
      POSTGRES_DB: ${DB_NAME:-aiworkspace_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiworkspace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-supersecret}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-aiworkspace}:${DB_PASSWORD:-supersecret}@db:5432/${DB_NAME:-aiworkspace_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-supersecret}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["node", "dist/server.js"] # In a real app, this might point to dist/worker.js or similar
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-aiworkspace}:${DB_PASSWORD:-supersecret}@db:5432/${DB_NAME:-aiworkspace_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-supersecret}@redis:6379
      - WORKER_MODE=true # Example flag to tell app to start workers instead of HTTP server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
