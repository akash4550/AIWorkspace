name: AIWorkspace CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      # Generate Prisma Client so types are available
      - name: Generate Prisma Client
        run: npm run generate -w apps/api
        
      - name: Lint API
        run: npm run lint -w apps/api --if-present
        
      - name: Lint Web
        run: npm run lint -w apps/web --if-present

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Typecheck Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate -w apps/api

      - name: Run API Tests
        run: npm run test -w apps/api --if-present
        
      - name: Run Web Tests
        run: npm run test -w apps/web --if-present

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate -w apps/api

      - name: Build API
        run: npm run build -w apps/api
        
      - name: Build Web
        run: npm run build -w apps/web
        env:
          NODE_ENV: production

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Replace this with your actual registry (e.g. AWS ECR, Docker Hub)
      # - name: Login to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false # Set to true in real deployment
          tags: aiworkspace-api:latest
          
      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false # Set to true in real deployment
          tags: aiworkspace-web:latest
