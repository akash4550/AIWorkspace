name: AIWorkspace CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiworkspace_test
          POSTGRES_PASSWORD: aiworkspace_test
          POSTGRES_DB: aiworkspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiworkspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aiworkspace_test:aiworkspace_test@127.0.0.1:5432/aiworkspace_test
      DIRECT_DATABASE_URL: postgresql://aiworkspace_test:aiworkspace_test@127.0.0.1:5432/aiworkspace_test
      AUTH_TEST_DATABASE_URL: postgresql://aiworkspace_test:aiworkspace_test@127.0.0.1:5432/aiworkspace_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-token-secret-change-me-now
      JWT_REFRESH_SECRET: ci-refresh-token-secret-change-me-now
      JWT_ISSUER: aiworkspace-api
      JWT_ACCESS_AUDIENCE: aiworkspace-api
      JWT_REFRESH_AUDIENCE: aiworkspace-auth
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Deploy committed database migrations
        run: npm run test:db:migrate

      - name: Type-check workspaces with their declared compilers
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Run frontend authentication tests
        run: npm run test --workspace=web

      - name: Build production application artifacts
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      COMPOSE_PROJECT_NAME: aiworkspace-ci
      API_PORT: '14000'
      WEB_PORT: '18080'
      SMOKE_WEB_URL: http://127.0.0.1:18080
      JWT_ACCESS_SECRET: ci-production-access-secret-change-me
      JWT_REFRESH_SECRET: ci-production-refresh-secret-change-me
      FRONTEND_URL: http://127.0.0.1:18080
      DB_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production Docker images
        run: npm run docker:build

      - name: Start isolated production topology
        run: docker compose -f docker-compose.production.yml up -d --no-build --wait postgres redis api web

      - name: Prepare isolated production authentication fixture
        run: npm run smoke:prepare-auth

      - name: Validate production startup and routing
        run: npm run smoke:production

      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color

      - name: Stop isolated production topology
        if: always()
        run: docker compose -f docker-compose.production.yml down -v
